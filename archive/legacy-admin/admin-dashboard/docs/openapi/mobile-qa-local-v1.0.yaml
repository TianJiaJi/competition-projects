    "/qa/conversations/{conversationId}/messages": {
      "get": {
        "operationId": "getMessages",
        "description": "返回当前会话全部历史；本地版尚无分页。外部身份查不到会话返回404，运行标识不匹配返回409。",
        "parameters": [
          {
            "name": "X-Run-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "conversationId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "items": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "id": {
                                "type": "string"
                              },
                              "role": {
                                "enum": [
                                  "user",
                                  "assistant"
                                ]
                              },
                              "text": {
                                "type": "string"
                              },
                              "status": {
                                "enum": [
                                  "generating",
                                  "completed",
                                  "failed",
                                  "interrupted"
                                ]
                              },
                              "sources": {
                                "type": "array",
                                "items": {
                                  "type": "object",
                                  "properties": {
                                    "id": {
                                      "type": "string"
                                    },
                                    "title": {
                                      "type": "string"
                                    },
                                    "kind": {
                                      "type": "string"
                                    },
                                    "excerpt": {
                                      "type": "string"
                                    },
                                    "version": {
