      "post": {
        "operationId": "askQuestion",
        "description": "SSE start/delta/sources/done/error。start 包含 messageId；delta.text 为增量；sources.sources 为引用数组；done.status=completed；error 包含 code。断开取消，部分回答保留。相同 key/内容重放不调用模型，内容冲突409；重试使用新 key 和失败 assistant ID。",
        "parameters": [
          {
            "name": "X-Run-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "conversationId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            }
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "example": "event: delta\ndata: {\"text\":\"青岚山境\"}\n\n"
              }
            }
          },
          "default": {
            "description": "失败，见 error.code",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "object",
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "message": {
                          "type": "string"
                        }
                      },
                      "required": []
                    },
                    "meta": {
                      "type": "object"
                    }
                  },
                  "required": []
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "text": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 1200
                  },
                  "retryOf": {
                    "type": "string"
                  },
                  "snapshot": {
                    "type": "object",
                    "description": "仅接受共享点位的 availability/load 白名单枚举作为本地公开演示状态，不是可信生产状态。"
                  }
                },
                "required": [
                  "text"
                ]
              }
            }
          }
        }
