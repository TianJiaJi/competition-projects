    OpsPrototypeSnapshot:
      type: object
      description: 2026-09-12 园方完整 Mock 展示结构。仅供前端原型使用，尚无 HTTP 路径；public 使用当前 packages/contracts 的字典型 PublicSnapshot，不能直接套用旧 V1 数组型公开投影。
      required: [id, label, businessTime, public, checkedInToday, windSpeedMps, history, alerts, events]
      properties:
        id: {type: string}
        label: {type: string}
        businessTime: {type: string, format: date-time}
        public:
          type: object
          description: 当前前端 PublicSnapshot，包括 points/regions 字典、完整卫生间/索道数值及六类安全设施可用性。以 packages/contracts/src/index.ts 为字段定义来源。
        checkedInToday: {type: integer, minimum: 0}
        windSpeedMps: {type: number, minimum: 0}
        history:
          type: array
          items:
            type: object
            required: [time, count]
            properties:
              time: {type: string, format: date-time}
              count: {type: integer, minimum: 0}
        alerts:
          type: array
          items: {$ref: '#/components/schemas/OpsPrototypeAlert'}
        events:
          type: array
          items: {$ref: '#/components/schemas/OpsPrototypeFeedEvent'}
    OpsPrototypeAlert:
      type: object
      description: 提醒/重要/紧急；前线开始及完成反馈。人工结案不修改监测值；同轮异常不重复触发，恢复再超限才产生新编号。安全维护与定期检修共用此结构。
      required: [id, anchorId, regionId, category, severity, status, title, location, reason, metric, startedAt, records]
      properties:
        id: {type: string}
        anchorId: {type: string, description: 共享点位 ID 或 region- 加区域 ID}
        regionId: {type: string}
        category: {type: string, enum: [crowd, parking, cable, restroom, equipment, help, cleaning, inspection]}
        severity: {type: string, enum: [reminder, important, critical]}
        status: {type: string, enum: [pending, processing, resolved]}
        title: {type: string}
        location: {type: string}
        reason: {type: string}
        metric: {type: string, description: 已带单位和时间语义的原型监测摘要}
        startedAt: {type: string, format: date-time}
        previousAlertId: {type: string}
        records:
          type: array
          items: {$ref: '#/components/schemas/OpsPrototypeHandlingRecord'}
    OpsPrototypeHandlingRecord:
      type: object
      required: [at, kind, actor, text]
      properties:
        at: {type: string, format: date-time}
        kind: {type: string, enum: [created, started, completed]}
        actor: {type: string}
        text: {type: string}
    OpsPrototypeFeedEvent:
      type: object
      required: [id, alertId, at, kind, title, text, severity]
      properties:
        id: {type: string}
        alertId: {type: string}
        at: {type: string, format: date-time}
        kind: {type: string, enum: [created, started, completed]}
        title: {type: string}
        text: {type: string}
        severity: {type: string, enum: [reminder, important, critical]}
