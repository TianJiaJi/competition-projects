  version: 1.0.0
  x-product-update-20260912: 人脸识别入园替代扫码入园；gate 改为前线处置；园方只读、人工调度、前线完成结案。旧扫码及自动恢复流程不再作为实施基线。新增 OpsPrototypeSnapshot 等结构仅描述当前 Mock 展示，不代表已实现接口。
  description: 文档契约，尚未实现。五端共享单实例后端；数值规则以景区24小时数据与数值仿真设计方案 V1.0 为准。REST 路径相对同源 /api/v1；WebSocket 使用 /ws，协议见配套 Markdown。
