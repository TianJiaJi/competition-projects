<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>navigation-layout</title></head><body>
<template id="navigation-layout"><header><h1 data-bind="applicationName">应用名称</h1><nav><a href="#overview">总览</a><a href="#records">记录</a><a href="#settings">设置</a></nav><span data-bind="identity"></span><button data-action="logout">退出</button></header><main>

</main><p role="status" data-bind="feedback"></p></template>
</body></html>
