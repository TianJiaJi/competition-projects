<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>public-pages</title></head><body>
<template id="public-pages"><header><h1 data-bind="applicationName">应用名称</h1><nav><a href="#overview">总览</a><a href="#buildings">楼宇</a><a href="#facilities">设施</a><a href="#venues">空间</a><a href="#bookings">预约记录</a><a href="#notices">公告</a></nav><span data-bind="identity"></span><button data-action="logout">退出</button></header><main>
<section data-page="overview"><section class="metrics" aria-label="运行指标"><article data-repeat="metrics"><h3 data-bind="label"></h3><output data-bind="value"></output><small data-bind="unit"></small></article></section><section data-component="space-browser"><nav aria-label="浏览视角"><button data-view="overview">全景</button><button data-view="learning">重点区域</button></nav><div data-bind="space.geometry" role="img" aria-label="空间视图"></div><aside data-bind="space.selection"><h2 data-bind="title"></h2><dl><dt>建筑编号</dt><dd data-bind="buildingId"></dd><dt>关联设施</dt><dd data-bind="facilityId"></dd></dl></aside></section></section>

<section data-page="buildings"><h2>楼宇</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.buildings"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="facilities"><h2>设施</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.facilities"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="venues"><h2>场馆与预约</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.venues"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="bookings"><h2>预约记录</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.bookings"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="notices"><h2>公告</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.notices"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="detail"><h2 data-bind="record.title">记录详情</h2><dl><dt>位置</dt><dd data-bind="record.location"></dd><dt>状态</dt><dd data-bind="record.status"></dd><dt>提交人</dt><dd data-bind="record.submitterId"></dd><dt>处理人</dt><dd data-bind="record.assigneeId"></dd><dt>处理结果</dt><dd data-bind="record.result"></dd></dl><p data-bind="record.description"></p></section>
</main><p role="status" data-bind="feedback"></p></template>
</body></html>
