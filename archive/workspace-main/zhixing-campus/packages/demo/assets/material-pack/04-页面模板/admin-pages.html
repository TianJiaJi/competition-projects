<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>admin-pages</title></head><body>
<template id="admin-pages"><header><h1 data-bind="applicationName">应用名称</h1><nav><a href="#overview">总览</a><a href="#buildings">buildings</a><a href="#people">people</a><a href="#facilities">facilities</a><a href="#tasks">tasks</a><a href="#inspections">inspections</a><a href="#bookings">bookings</a><a href="#notices">notices</a><a href="#security">security</a></nav><span data-bind="identity"></span><button data-action="logout">退出</button></header><main>
<form data-page="login"><label>账号<input name="username" type="text" required /></label><label>密码<input name="password" type="password" required /></label><button type="submit">登录</button><p role="alert" data-bind="error"></p></form>

<section data-page="overview"><section class="metrics" aria-label="运行指标"><article data-repeat="metrics"><h3 data-bind="label"></h3><output data-bind="value"></output><small data-bind="unit"></small></article></section></section>

<section data-page="buildings"><h2>buildings</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.buildings"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="people"><h2>people</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.people"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="facilities"><h2>facilities</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.facilities"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="tasks"><h2>tasks</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.tasks"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="inspections"><h2>inspections</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.inspections"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="bookings"><h2>bookings</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.bookings"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="notices"><h2>notices</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.notices"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<section data-page="security"><h2>security</h2><form role="search"><label>关键词<input name="query" type="text" required /></label><select name="status" aria-label="状态"><option value="">全部</option></select><button>查询</button></form><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr data-repeat="records.security"><td data-bind="title"></td><td data-bind="location"></td><td data-bind="category"></td><td data-bind="status"></td><td><button data-action="detail">查看详情</button><button data-action="edit">编辑</button><button data-action="create">新增</button></td></tr></tbody></table><p data-if="empty">暂无记录</p></section>

<form data-page="editor"><h2>维护记录</h2><label>title<input name="title" type="text" required /></label><label>location<input name="location" type="text" required /></label><label>category<input name="category" type="text" required /></label><label>status<input name="status" type="text" required /></label><label>date<input name="date" type="date" required /></label><label>buildingId<input name="buildingId" type="text" required /></label><label>facilityId<input name="facilityId" type="text" required /></label><label>submitterId<input name="submitterId" type="text" required /></label><label>assigneeId<input name="assigneeId" type="text" required /></label><label>timeSlot<input name="timeSlot" type="text" required /></label><label>count<input name="count" type="number" required /></label><label>说明<textarea name="description" required></textarea></label><label>处理结果<textarea name="result"></textarea></label><button type="submit">保存</button><button type="button" data-action="cancel-edit">取消</button><p role="alert" data-bind="error"></p></form>

<section data-page="detail"><h2 data-bind="record.title">记录详情</h2><dl><dt>位置</dt><dd data-bind="record.location"></dd><dt>状态</dt><dd data-bind="record.status"></dd><dt>提交人</dt><dd data-bind="record.submitterId"></dd><dt>处理人</dt><dd data-bind="record.assigneeId"></dd><dt>处理结果</dt><dd data-bind="record.result"></dd></dl><p data-bind="record.description"></p></section>
</main><p role="status" data-bind="feedback"></p></template>
</body></html>
