<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>智慧景区 AI 协同运行架构</title><desc>现有系统与三个智能体协作。运行数据经过异常监测与研判，调用业务接口推送告警和建议，人员安排执行，处置结果回写，形成持续监测闭环。游客问答与内容审核为两条服务支路。三个智能体共用大模型、知识库和业务工具。</desc><defs><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#83CBB6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#69B7EA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="64" y="86" font-family="Heiti SC, PingFang SC, sans-serif" font-size="44" fill="#E7EFEB" text-anchor="start">智慧景区 AI 协同运行架构</text><text x="66" y="128" font-family="Heiti SC, PingFang SC, sans-serif" font-size="23" fill="#A3BBB5" text-anchor="start">数据感知 · 智能研判 · 人工处置 · 反馈闭环</text><path d="M64 156 H1856" fill="none" stroke="#436362" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="210" font-family="Heiti SC, PingFang SC, sans-serif" font-size="31" fill="#E7EFEB" text-anchor="start">现有系统</text><text x="752" y="210" font-family="Heiti SC, PingFang SC, sans-serif" font-size="31" fill="#83CBB6" text-anchor="start">我们开发的 AI 部分</text><text x="1856" y="210" font-family="Heiti SC, PingFang SC, sans-serif" font-size="20" fill="#A3BBB5" text-anchor="end">感知 → 分析 → 行动 → 反馈</text><path d="M692 188 V1006" fill="none" stroke="#436362" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1304 880 V844 M1020 814 V844 H1876 V416 H1856 M1588 814 V844" fill="none" stroke="#436362" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1304" cy="844" r="4" fill="#83CBB6"/><rect x="136" y="272" width="472" height="126" rx="20" fill="#203A3C" stroke="#4