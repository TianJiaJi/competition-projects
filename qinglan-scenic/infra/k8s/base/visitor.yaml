apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenic-visitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenic-visitor
  template:
    metadata:
      labels:
        app: scenic-visitor
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: visitor
        image: scenic/visitor:pg-target-dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scenic-visitor
spec:
  selector:
    app: scenic-visitor
  ports:
  - name: http
    port: 8080
    targetPort: http
