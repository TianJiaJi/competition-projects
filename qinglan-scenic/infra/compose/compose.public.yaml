name: scenic-demo

services:
  server:
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://m.starhusk.com,https://ops.starhusk.com,https://visitor.starhusk.com,https://admin.starhusk.com,https://gate.starhusk.com,https://demo.starhusk.com

  gateway:
    restart: unless-stopped
    entrypoint: [caddy]
    command: [run, --config, /etc/caddy/Caddyfile.public, --adapter, caddyfile]
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile.public:ro
      - caddy-internal-data:/data

  sakurafrp:
    image: natfrp.com/frpc:latest
    pull_policy: always
    command:
      - --disable_log_color
      - --log_level
      - info
      - --hosts
      - dx.frp-put.com:221.178.62.105
      - -w
      - -f
      - ${SAKURA_FRP_START_ARGS:?set the private SakuraFrp value after -f}
    restart: unless-stopped
    depends_on: [gateway]
    network_mode: service:gateway

volumes:
  caddy-internal-data: {}
